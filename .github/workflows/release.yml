name: Publish Package to npmjs

on:
  workflow_dispatch:
  push:
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'yandex/ymaps3-clusterer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate release tag
        run: |
          node <<'NODE'
          const {version} = require('./package.json');
          if (process.env.GITHUB_REF_TYPE !== 'tag' || process.env.GITHUB_REF_NAME !== version) {
            throw new Error('Select a version tag matching package.json, without a v prefix.');
          }
          NODE

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          APIKEY: ${{ secrets.APIKEY }}
          REFERRER: ${{ secrets.REFERRER }}
      - name: Test
        run: npm test
        env:
          APIKEY: ${{ secrets.APIKEY }}
          REFERRER: ${{ secrets.REFERRER }}
      - name: Inspect package
        run: npm pack --dry-run
      - name: Publish
        run: npm publish ./ --access public

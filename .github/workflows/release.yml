name: Publish Package to npmjs

on:
  workflow_dispatch:
  push:
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'yandex/ymaps3-clusterer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Validate release tag
        run: |
          node <<'NODE'
          const {version} = require('./package.json');
          if (process.env.GITHUB_REF_TYPE !== 'tag' || process.env.GITHUB_REF_NAME !== version) {
            throw new Error('Select a version tag matching package.json, without a v prefix.');
          }
          NODE

      - name: Check that the version is unpublished
        run: |
          node <<'NODE'
          const {name, version} = require('./package.json');
          (async () => {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`, {
              signal: AbortSignal.timeout(15000)
            });
            if (response.status === 200) throw new Error(`${name}@${version} is already published.`);
            if (response.status !== 404) throw new Error(`npm registry returned ${response.status}.`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE

      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # The shared webpack config requires a key but does not make API requests.
          APIKEY: build-only
      - name: Test
        run: |
          test -n "$APIKEY" || { echo 'Configure the APIKEY secret before releasing.'; exit 1; }
          npm test -- --runInBand
        env:
          APIKEY: ${{ secrets.APIKEY }}
          REFERRER: ${{ secrets.REFERRER || 'http://yandex.localhost/' }}
      - name: Inspect package
        run: npm pack --dry-run
      - name: Publish
        run: npm publish ./ --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
